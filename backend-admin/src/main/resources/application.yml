server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/cyberflow?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /admin/api-docs
  swagger-ui:
    path: /admin/swagger-ui.html

cyberflow:
  crawler-api:
    base-url: ${CRAWLER_API_BASE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_API_TOKEN:change-me-in-production}
  jwt:
    secret: ${JWT_SECRET:cyberflow-admin-jwt-secret-key-2026}
    expiration: 14400000
