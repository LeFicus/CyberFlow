server:
  port: 8080

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  sql:
    init:
      mode: always

  datasource:
    url: jdbc:mysql://localhost:3306/cyberflow?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useCursorFetch=true&defaultFetchSize=500
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:admin}
    password: ${RABBITMQ_PASS:admin123}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
        default-requeue-rejected: false

  quartz:
    job-store-type: memory
    properties:
      org:
        quartz:
          scheduler:
            instanceName: CyberFlowScheduler
          threadPool:
            threadCount: 3

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

springdoc:
  api-docs:
    path: /admin/api-docs
  swagger-ui:
    path: /admin/swagger-ui.html

cyberflow:
  crawler:
    site-cron: "0 0 */6 * * ?"     # 从00:00开始，每6小时整点执行
    index-cron: "0 0 0 * * ?"      # 每天00:00采集站点收录快照
    order-cron: "0 0 */6 * * ?"    # 从00:00开始，每6小时整点执行
  jwt:
    secret: ${JWT_SECRET:cyberflow-admin-jwt-secret-key-2026}
    expiration: 14400000
