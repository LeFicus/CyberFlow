version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cyberflow-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.0
    container_name: cyberflow-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: cyberflow
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/init_v2_tables.sql:/docker-entrypoint-initdb.d/01-init.sql

  redis:
    image: redis:7-alpine
    container_name: cyberflow-redis
    ports:
      - "6379:6379"

  backend-admin:
    build: ./backend-admin
    container_name: cyberflow-admin
    ports:
      - "8080:8080"
    environment:
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_started

  crawler-consumer:
    build: ./crawler-consumer
    container_name: cyberflow-consumer
    environment:
      RABBITMQ_HOST: rabbitmq
      MYSQL_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_started

volumes:
  rabbitmq_data:
  mysql_data:
